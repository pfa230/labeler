schema: openspec-loop

context: |
  Labeler is a stateless label-rendering REST service in Rust (axum). It loads YAML label templates
  and renders a single label to PNG or a batch to PDF/ZIP by generating Typst source on the fly and
  compiling it in-process with `typst-as-lib` (`typst-render` for PNG, `typst-pdf` for PDF).

  Architecture. Request path: `api.rs` -> `render/`. Template path: `templates.rs` -> `parse.rs` ->
  `raw.rs` -> `convert.rs`. Parsing is two-stage: YAML deserializes into `raw.rs` structs (all
  `deny_unknown_fields`), then converts into the domain model via `TryFrom` in `convert.rs`. When
  adding a layout field, update `raw.rs`, the matching `models.rs` type, and the `TryFrom` in
  `convert.rs` together. Template coordinates use a bottom-left origin, y-up, in the template `unit`;
  Typst uses top-left, so the renderer flips with `frame_height_units - top`. Size resolution in
  `resolver.rs` is shared by load-time validation and render-time resolution; only the walk
  supplying intrinsic sizes differs. Errors: `TemplateError` carries a parse/validation path
  (a broken template is quarantined at load, not fatal to startup); `AppError` is the HTTP error and
  serializes to `{ "error": { code, message, details } }`. Add new error kinds as `AppError`
  constructors so `code` strings stay stable. Every model exposed in the API must be registered in
  `openapi.rs`.

  Specs. Freezing a file freezes no behavior: it says the file takes no further edits, not that what
  it describes cannot change. `docs/SPEC.md` is FROZEN at commit bc7b1ce as the baseline reference
  for behavior that existed on 2026-08-19. It is no longer edited. New and changed behavior is
  specified in `openspec/specs/<capability-path>/spec.md`, which is where a change to behavior lands.
  See `rules.specs` below for the precedence rule.

  Decisions. `docs/adr/` is FROZEN at ADR-0057, like `docs/SPEC.md` and for the same reason. Never
  write one and never add a row, and never open one for a rule that binds you now: an ADR records
  what was decided on a date, not what holds today. The 31 records once written after ADR-0057 are
  gone (#378); each duplicated a change folder that `openspec/changes/archive/` keeps permanently.
  Why a change was made belongs in its `proposal.md` and `design.md`, kept in that same archive
  (#285).

  Tracker. GitHub issues and milestones are the sole live backlog. Every change corresponds to
  exactly one open issue.

  Isolation. One change, one git worktree, one issue. `npx --no-install openspec-loop run --change <name>`
  creates the change's worktree from a clean default-branch checkout at `origin/<default>`.
  Supply the accepted issue's requirements in the brief; the runtime does not fetch GitHub issues.
  Run continuations from the change's worktree. An unrelated hotfix gets its own worktree;
  never switch branches inside a change's worktree.

  Gates. `.openspec-loop.yml` declares the commands the runtime runs before delivery:
  `cargo fmt --check`, `cargo clippy --all-targets --all-features -- -D warnings`, `cargo test`,
  `cargo build`, and `npm --prefix ui run lint`, `npm --prefix ui run test`,
  `npm --prefix ui run build`. Keep Rust build output local to each worktree.
  Never silence a lint with `#[allow(clippy::...)]`; fix the root cause.
  Templates are visual artifacts: a YAML edit that parses and renders without error is not proof the
  label looks right. Use a render -> inspect -> fix loop against a PNG before calling a template done.

rules:
  proposal:
    - >-
      Include `Fixes #N` for the GitHub issue this change implements in the first section.
      Squash delivery uses the proposal as its commit body, so this closes the issue on merge.
      Exactly one open issue per change.
    - >-
      Keep scope inside that issue's accepted scope. Work discovered mid-change that falls outside
      it becomes a new GitHub issue, never an extra task here.
    - >-
      State when the whole deliverable is its delta under `specs/`, as for a correction to a
      published spec. `openspec/specs/` is written by archive and never by hand. Changes without
      a spec-level behavior change set `skip_specs: true` in their `.openspec.yaml`; do not invent
      a capability for tooling, documentation or a behavior-preserving refactor.

  specs:
    - >-
      `docs/SPEC.md` is frozen at commit bc7b1ce. Its sections stay authoritative until an OpenSpec
      requirement explicitly supersedes them.
    - >-
      When a change touches behavior documented only in frozen `docs/SPEC.md`, write an ADDED
      requirement containing the complete post-change contract, not the difference, and name the
      exact `docs/SPEC.md` section it supersedes. Never write a MODIFIED delta against a requirement
      that does not yet exist in `openspec/specs/`.
    - >-
      An ADDED requirement supersedes only the `docs/SPEC.md` section it names. Unrelated frozen
      sections remain authoritative.
    - >-
      Once a requirement lives in `openspec/specs/`, later changes to it use MODIFIED as normal.
    - >-
      A delta spec is proposed truth. It becomes normative only after it is synced into
      `openspec/specs/`.

  design:
    - >-
      State the decision and why it was taken over the alternatives. This is the record: `docs/adr/`
      is frozen and takes no new entries, so nothing else will carry the rationale.

  tasks:
    - >-
      Tasks are execution steps for this change only. They are not a backlog, so never park future
      work as an unchecked task. Open a GitHub issue instead.
    - >-
      Verify the affected behavior with appropriate tests. The runtime runs the declared gates
      from `.openspec-loop.yml`; no task may claim a check passed before it actually ran.

operations:
  apply:
    guidance:
      - >-
        Use `npx --no-install openspec-loop run` for the automated workflow. The runtime commits stage output,
        runs the declared tests, and obtains an independent implementation review. For a manual
        workflow, commit the implementation before `npx --no-install openspec-loop review implement --change
        <name>`; the review covers committed content and writes a numbered record under
        `reviews/implement-*.md`. Never manufacture or refresh a verdict by hand.
      - >-
        The reviewer must be a different named participant from every producer, with a read-only
        tree. Implementation requires APPROVE; requested fixes require a revision and fresh review.
        Do not archive or deliver while the current review refuses the implementation.
      - >-
        Check a task only after performing it. A checked box is a claim the next reader trusts
        instead of redoing the work. A task saying to add an HTTP test is not satisfied by a unit
        test one layer below the status code. Do not write a task whose completion nothing can
        show, such as opening a rendered image.
      - >-
        A test that cannot fail is worse than no test. Assert on the value under test, not on the
        fact that a call returned. Before accepting a test, name what would have to break for it
        to fail.
      - >-
        Never edit `docs/SPEC.md`. It is frozen and archive cannot represent an edit to it.
        Changed behavior belongs in this change's delta under `specs/`, then in the published
        `openspec/specs/` after archive.
      - >-
        Stay inside the change's accepted scope. Widening a shared parser, loosening a type, or
        changing behavior for inputs the issue never mentions is out of scope even when it makes
        the new code simpler. Keep existing behavior and pin it with a test.

  archive:
    guidance:
      - >-
        Let `npx --no-install openspec-loop run` perform archive and delivery. For a manual workflow, use
        `npx --no-install openspec-loop archive --change <name>` only after current approving plan and
        implementation reviews and completed tasks. Sync every delta into `openspec/specs/`;
        never archive without syncing. A change declaring `skip_specs: true` has no deltas.
      - >-
        The runtime's archive checks compare published specs with replayed deltas. Its numbered
        review records carry participant identities and committed subject manifests; the old
        `diff-review.md` and tree-digest format are not used.
      - >-
        Delivery uses `mode: commit` and `squash: true`: one local landing commit, with no push
        or merge. Include `Fixes #N` and explain why the change is needed in its commit message.
        Never add AI attribution. Successful delivery removes the linked worktree and retains
        the branch unless local cleanup settings keep the worktree.
      - >-
        Integration requires human approval. Fast-forward the approved branch into the default
        branch, then push. Never merge main into a change branch, never rewrite main or any ref
        another session consumes. Commit delivery does not rebase onto a moved default branch;
        if integration is no longer a fast-forward, stop and obtain fresh review evidence for
        the updated candidate before integrating it.
      - >-
        Landing checks read committed history. Run `npx --no-install openspec-loop check --target-ref <ref>`
        on the exact commit to integrate, where <ref> is the destination ref. A refusal or an
        operational error stops delivery. Re-run checks after any later commit.
      - >-
        The `openspec-*` skills and `opsx` commands under `.claude/`, `.agent/`, `.agents/`
        and `.opencode/` are generated by the OpenSpec CLI. Never hand-edit them. Upgrade the
        CLI, run `openspec update --force`, review the generated trees, and commit regeneration
        separately.
