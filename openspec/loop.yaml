defaultBranch: main
worktrees: .worktrees
agents:
  codex: [loop-codex, -s, read-only]
  claude: [loop-claude, --model, opus, --permission-mode, auto]
  deepseek: [loop-jail, loop-opencode, --auto, -m, openrouter/deepseek/deepseek-v4.1-flash]
  mimo: [loop-jail, loop-opencode, --auto, -m, openrouter/xiaomi/mimo-v2.6-flash]
  glm: [loop-jail, loop-opencode, --auto, -m, openrouter/~z-ai/glm-flash-latest]
  muse-contrib: [loop-jail, loop-opencode, --auto, -m, meta/muse-spark-1.3-contributor]
roles:
  proposalReviewer: codex
  planReviser: muse-contrib
  implementer: mimo
  implementationReviewer: codex
attempts:
  proposalReview: 3
  implementation: 3
checks:
  # A run's worktree starts without dependencies; the gates below need both manifests installed.
  - npm ci --silent && npm --prefix ui ci --silent
  - cargo fmt --check
  - cargo clippy --all-targets --all-features -- -D warnings
  - cargo test
  - npm --prefix ui run lint
  - npm --prefix ui run test
  - npm --prefix ui run build
  - npx --no-install openspec validate --all --strict --no-interactive
delivery: pr
