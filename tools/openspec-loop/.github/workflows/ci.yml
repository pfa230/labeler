name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The suites build throwaway repos and make real commits in them.
      - name: Identify
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      # These are the only check on the review process. A gate that quietly stops
      # firing looks exactly like a gate that passes, so it has to fail loudly here.
      - name: Workflow script tests
        run: |
          workflow/gate-tests.sh
          workflow/apply-tests.sh
          workflow/change-tests.sh

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error workflow/*.sh .githooks/* hooks/*.sh bin/* || true
