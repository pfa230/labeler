name: Avery 5163 2" x 4" Shipping Label
description: Ten 2x4 inch labels per US Letter sheet, single text field
unit: in
dpi: 300
params:
  message:
    type: string
    description: "Label message text"
    multiline: true
format:
  type: sheet
  paper_width: 8.5
  paper_height: 11.0
  label_width: 4.0
  label_height: 2.0
  # Units: inches. Origin is page bottom-left. Positions from homebox common.py
  # (MARGIN_LEFT 0.17, H_GAP 0.16 -> right col x = 0.17+4+0.16 = 4.33; MARGIN_TOP/BOTTOM 0.5).
  positions:
    - [0.17, 8.5]
    - [4.33, 8.5]
    - [0.17, 6.5]
    - [4.33, 6.5]
    - [0.17, 4.5]
    - [4.33, 4.5]
    - [0.17, 2.5]
    - [4.33, 2.5]
    - [0.17, 0.5]
    - [4.33, 0.5]
layout:
  - type: container
    at: [0.0, 0.0]
    size: [4.0, 2.0]
    padding: 0.15
    items:
      - type: text
        value: "{message}"
        at: [0.0, 0.0]
        size: [3.7, 1.7]
        font_size:
          min: 10.0
          max: 48.0
        wrap: true
        alignment:
          horizontal: center
          vertical: center
