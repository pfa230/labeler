name: Brother 24mm Continuous Label (text only)
description: Continuous tape, 24mm nominal (18.1mm printable at 180 dpi), text only
unit: mm
dpi: 180
params:
  - name: message
    type: string
    description: "Label message text"
format:
  type: single
  width:
    min: 10.0
    max: 120.0
  height: 18.1
  media_width: 24
layout:
  - type: container
    at: [0.0, 0.0]
    size: [fill, 18.1]
    padding: 1.0
    items:
      - type: text
        value: "{message}"
        at: [0.0, 0.0]
        size: [fill, 16.1]
        font_size:
          min: 10.0
          max: 32.0
        wrap: false
        alignment:
          horizontal: center
          vertical: center
