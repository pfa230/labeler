name: Brother 18mm Continuous Label (text only)
description: Continuous tape, 18mm nominal (15.8mm printable at 180 dpi), text only
unit: mm
dpi: 180
params:
  message:
    type: string
    description: "Label message text"
format:
  type: single
  width:
    min: 10.0
    max: 100.0
  height: 15.8
  media_width: 18
layout:
  - type: container
    at: [0.0, 0.0]
    size: [fill, 15.8]
    padding: 1.0
    items:
      - type: text
        value: "{message}"
        at: [0.0, 0.0]
        size: [fill, 13.8]
        font_size:
          min: 8.0
          max: 28.0
        wrap: false
        alignment:
          horizontal: center
          vertical: center
