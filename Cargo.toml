[package]
name = "labeler"
version = "0.1.0"
edition = "2021"
description = "Self-hosted REST service that renders labels from declarative YAML templates."
license = "MIT"
repository = "https://github.com/pfa230/labeler"
publish = false

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
serde_path_to_error = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.7", features = ["trace", "fs"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
typst = "0.15"
typst-layout = "0.15"
typst-as-lib = { version = "0.16", features = ["typst-kit-embed-fonts", "typst-kit-fonts"] }
typst-render = "0.15"
typst-pdf = "0.15"
qrcode = "0.14"
ttf-parser = { version = "0.25", features = ["variable-fonts"] }
base64 = "0.22"
arc-swap = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
ipp = "6"
async-trait = "0.1"
csv = "1.4.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
argon2 = "0.5"
rand = "0.10"
sha2 = "0.10"
hex = "0.4"
axum-extra = { version = "0.12", features = ["cookie"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
url = "2"
hmac = "0.12"
urlencoding = "2.1"
regex = "1"
rustix = { version = "1", features = ["fs"] }

image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

# 500 crates (Typst pulls a large tree) with full DWARF debug info fills tens of GB across dev and
# release builds. line-tables-only keeps file/line in backtraces — all this repo's panics and test
# failures need — while dropping variable/type data, which is the bulk of the size.
[profile.dev]
debug = "line-tables-only"

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
wiremock = "0.6"
typst-assets = "0.15"
