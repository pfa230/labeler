name: Container Circle Gated
unit: mm
dpi: 200
format:
  type: single
  width: 50
  height: 50
params:
  - name: w
    type: length
    default: 20
  - name: enabled
    type: enum
    values: ["yes", "no"]
    default: "no"
layout:
  - type: container
    at: [5, 5]
    shape: circle
    size: ["{w}", 20]
    when: { enabled: "yes" }
    stroke:
      thickness: 0.5
      color: black
    items: []
