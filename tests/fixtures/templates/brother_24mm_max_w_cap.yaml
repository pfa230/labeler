name: Brother 24mm Bounded Auto-Width Demo
description: Dynamic-width tape with a fixed-size qr and a content-width text capped by max_w well below the frame remainder, so the label shrinks to its content instead of the full width.max (#152)
unit: mm
dpi: 180
params:
  code:
    type: string
  message:
    type: string
format:
  type: single
  width:
    min: 10.0
    max: 150.0
  height: 18.1
  media_width: 24
layout:
  - type: qr
    value: "{code}"
    at: [1.0, 0.0]
    size: [18.1, 18.1]
  - type: text
    value: "{message}"
    at: [21.1, 0.0]
    size: [content, 18.1]
    max_w: 30.0
    font_size:
      min: 8.0
      max: 32.0
    multiline: false
    alignment:
      horizontal: left
      vertical: center
