name: Container Ellipse Stroked Cross
unit: mm
dpi: 200
format:
  type: single
  width: 50
  height: 30
layout:
  - type: container
    at: [2, 2]
    shape: ellipse
    size: [46, 26]
    stroke:
      thickness: 1.0
      color: '#cc0000'
    background: '#fff0f0'
    items:
      - type: text
        value: "Child crossing curve"
        at: [0, 0]
        size: [46, 26]
        font_size: 8
