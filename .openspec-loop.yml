impl_paths:
  - src
  - tests
  - ui/src

frozen_paths:
  - docs/SPEC.md
  - docs/adr

setup:
  - npm ci
  - npm --prefix ui ci

tests:
  - cargo fmt --check
  - cargo clippy --all-targets --all-features -- -D warnings
  - cargo test
  - cargo build
  - npm --prefix ui run lint
  - npm --prefix ui run test
  - npm --prefix ui run build

delivery:
  mode: commit
  squash: true
